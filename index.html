<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="dark-theme font-sans">

    <div class="flex flex-col md:flex-row min-h-screen">
        <!-- Sidebar -->
        <aside id="sidebar" class="bg-gray-800 text-white w-full md:w-64 flex-shrink-0">
            <div class="p-4 text-2xl font-bold">Admin</div>
            <nav class="mt-4">
                <a href="#" id="nav-home" class="nav-link active-link"><i class="fas fa-home mr-3"></i>Home</a>
                <a href="#" id="nav-settings" class="nav-link"><i class="fas fa-cog mr-3"></i>Settings</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col">
            <header class="bg-gray-900 shadow-md p-4 flex justify-between items-center">
                <button id="menu-toggle" class="md:hidden text-white">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="flex items-center">
                    <span id="auth-status-badge" class="status-badge status-red">Unauthorized</span>
                </div>
            </header>

            <main id="home-page" class="flex-1 p-4 md:p-8 bg-gray-900 text-white">
                <h1 class="text-3xl font-bold mb-6">Welcome to the Admin Interface</h1>
                <p>Select "Settings" from the sidebar to configure your Genesys Cloud connection.</p>

                <div id="identity-summary" class="mt-8 bg-gray-800 p-6 rounded-lg shadow-lg hidden">
                    <h2 class="text-2xl font-bold mb-4">Current Identity</h2>
                    <div id="identity-details" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Identity info will be populated here -->
                    </div>
                </div>
            </main>

            <main id="settings-page" class="flex-1 p-0 md:p-8 bg-gray-900 text-white hidden">
                <div class="w-full max-w-4xl mx-auto">
                    <div class="bg-gray-800 rounded-lg shadow-lg p-6 md:p-8">
                        <h1 class="text-3xl font-bold mb-6">Genesys Cloud Settings</h1>

                        <!-- Region and Credential Type -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                            <div>
                                <label for="region" class="form-label">Region</label>
                                <select id="region" class="form-input">
                                    <option value="us-east-1">US East (N. Virginia)</option>
                                    <option value="us-west-2">US West (Oregon)</option>
                                    <option value="ca-central-1">Canada (Central)</option>
                                    <option value="sa-east-1">South America (São Paulo)</option>
                                    <option value="eu-central-1">Europe (Frankfurt)</option>
                                    <option value="eu-west-1">Europe (Ireland)</option>
                                    <option value="eu-west-2">Europe (London)</option>
                                    <option value="ap-northeast-1">Asia Pacific (Tokyo)</option>
                                    <option value="ap-southeast-2">Asia Pacific (Sydney)</option>
                                    <option value="custom">Custom Base URL</option>
                                </select>
                            </div>
                            <div>
                                <label class="form-label">Credential Type</label>
                                <div class="flex items-center space-x-4 mt-2">
                                    <label><input type="radio" name="credentialType" value="client_credentials" checked class="form-radio"> Client Credentials</label>
                                    <label><input type="radio" name="credentialType" value="authorization_code" class="form-radio"> Authorization Code</label>
                                </div>
                            </div>
                        </div>

                        <!-- Custom Base URL Input -->
                        <div id="custom-base-url-container" class="mb-6 hidden">
                            <label for="customBaseUrl" class="form-label">Custom Base URL</label>
                            <input type="text" id="customBaseUrl" class="form-input" placeholder="https://api.example.com">
                        </div>

                        <!-- Credentials Input -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                            <div>
                                <label for="clientId" class="form-label">Client ID</label>
                                <input type="text" id="clientId" class="form-input">
                            </div>
                            <div>
                                <label for="clientSecret" class="form-label">Client Secret</label>
                                <input type="password" id="clientSecret" class="form-input">
                            </div>
                        </div>

                        <!-- Redirect URI (for Auth Code) -->
                        <div id="redirect-uri-container" class="mb-6 hidden">
                            <label for="redirectUri" class="form-label">Redirect URI</label>
                            <input type="text" id="redirectUri" class="form-input-static" readonly>
                            <p class="text-sm text-gray-400 mt-1">This should be configured in your Genesys Cloud OAuth client.</p>
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex flex-wrap items-center justify-between mt-8">
                            <div class="flex space-x-2">
                                <button id="save-config-btn" class="btn btn-primary">Save</button>
                                <button id="clear-config-btn" class="btn btn-danger">Clear</button>
                            </div>
                            <div id="auth-actions-container">
                                 <button id="login-btn" class="btn btn-secondary hidden">Login with Genesys Cloud</button>
                                 <button id="test-auth-btn" class="btn btn-secondary">Test Connection</button>
                            </div>
                        </div>
                         <div id="settings-message" class="mt-4 text-sm"></div>
                    </div>
                </div>
            </main>

            <footer class="bg-gray-800 text-white p-4 text-center">
                <p>&copy; 2025 Session & Identity Module</p>
            </footer>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
